[project]
name = "orca-proxy"
version = "0.1.0"
description = "Unified VM credential-injection & logging proxy — core service skeleton"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "cryptography>=42",
    "mitmproxy>=10,<11",
]

[project.scripts]
orca-proxy-firewall-sync = "orca_proxy.cli.firewall_sync:main"
orca-proxy-refresh-claude = "orca_proxy.cli.refresh_claude:main"
orca-proxy-refresh-codex = "orca_proxy.cli.refresh_codex:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orca_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
